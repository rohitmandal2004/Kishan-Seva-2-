name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ── Frontend: Type Check, Lint & Build ──
  frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Type Check
      run: npm run type-check
      
    - name: Lint
      run: npm run lint

    - name: Build production bundle
      run: npm run build
      env:
        VITE_SUPABASE_URL: https://placeholder.supabase.co
        VITE_SUPABASE_ANON_KEY: placeholder-key
        VITE_CLERK_PUBLISHABLE_KEY: pk_test_placeholder

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: frontend-dist
        path: dist/
        retention-days: 7

  # ── ML Service: Lint & Smoke Test ──
  ml-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-service
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: ml-service/requirements.txt

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Lint with ruff (if available)
      run: pip install ruff && ruff check app/ training/ || true

    - name: Verify FastAPI app imports
      run: python -c "from app.main import app; print('✓ FastAPI app imported successfully')"

  # ── Integration Tests (requires Supabase) ──
  test:
    runs-on: ubuntu-latest
    needs: [frontend]
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci

    - name: Setup Supabase CLI
      uses: supabase/setup-cli@v1
      with:
        version: latest

    - name: Start Supabase local instance
      run: supabase start
      
    - name: Test
      run: npm run test
      env:
        VITE_SUPABASE_URL: http://127.0.0.1:54321
